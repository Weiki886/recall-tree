name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

# 本节只做检查，不部署、不发布，因此按最小权限声明 contents: read，
# 不沿用默认的扩大化令牌，也不使用 write-all（见威胁模型 T12 供应链止血原则）。
permissions:
  contents: read

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 设置 JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 编译、格式检查与测试
        run: ./mvnw -q clean verify

      # Testcontainers 集成测试通过 failsafe-plugin 运行，激活 integration-tests profile。
      # GitHub runner 自带 Docker，无需额外 service container。
      - name: 集成测试
        run: ./mvnw -q -Pintegration-tests verify

  frontend:
    name: 前端静态检查与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 启用 pnpm
        # 版本由 package.json 的 packageManager 字段固定，
        # 这里显式 prepare 以避免 corepack 在版本缺失时交互式询问。
        run: corepack enable && corepack prepare pnpm@10.32.0 --activate && pnpm --version

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: web
        run: pnpm typecheck

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: 格式检查
        working-directory: web
        run: pnpm format:check

      - name: 测试
        working-directory: web
        run: pnpm test

      - name: 构建
        working-directory: web
        run: pnpm build

  scripts:
    name: 脚本检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: bash 语法检查
        run: bash -n scripts/dev-up.sh

      - name: ShellCheck 静态检查
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck scripts/dev-up.sh
