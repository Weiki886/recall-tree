recalltree:
  # 首版不需要任何配置即可启动。数据库与模型 Provider 配置在后续 Issue 中追加。
  # 本地开发使用 docker-compose.yml 提供的 PostgreSQL。
  # 所有凭据仅从环境变量读取，不写在配置文件中（见威胁模型 T9）。

spring:
  application:
    name: recalltree
  # 以下配置在集成测试中使用 Testcontainers 动态数据库覆盖，
  # 本地开发使用 docker-compose.yml 提供的 PostgreSQL。
  # 生产配置由部署环境管理，不在本仓库中。
  datasource:
    url: ${RECALLTREE_DB_URL:jdbc:postgresql://localhost:5432/recalltree}
    username: ${RECALLTREE_DB_USER:recalltree}
    password: ${RECALLTREE_DB_PASSWORD:recalltree}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    # 首版关闭 Flyway 自动迁移。后续 Issue 添加迁移脚本后启用（见 ADR-002 决策 3）。

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080
